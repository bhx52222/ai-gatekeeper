<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'">
  <title>AI 环境门禁</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">CLAUDE · OPENAI · GEMINI · GROK</p>
        <h1>AI 环境门禁</h1>
        <p class="subtitle">检查当前真实环境，选择需要处理的项目，再执行修改。修改前会自动保存恢复快照。</p>
      </div>
      <div id="overall" class="overall idle"><span class="dot"></span><span>尚未检测</span></div>
    </header>

    <section class="toolbar">
      <button id="detect" class="primary">开始检测</button>
      <button id="browserAudit">浏览器深度检测</button>
      <button id="fix" disabled>修改已选项目</button>
      <button id="fixAll" disabled>一键修改</button>
      <button id="restore" class="danger" disabled>一键恢复</button>
      <span id="platform"></span>
    </section>

    <details class="settings-panel">
      <summary>检测目标与代理设置</summary>
      <div class="settings-grid">
        <label>目标国家<input id="targetCountry" maxlength="2" placeholder="US"></label>
        <label>指定出口 IP（可留空）<input id="expectedIp" placeholder="例如 203.0.113.10"></label>
        <label class="wide">检测代理（可留空表示直连）<input id="proxyUrl" placeholder="http://127.0.0.1:6152"></label>
        <label>目标时区<input id="targetTimezone"></label>
        <label>目标语言<input id="targetLanguage"></label>
        <label>目标地区<input id="targetLocale"></label>
        <label>Claude 固定出口策略<input id="safetyPolicy" placeholder="02-固定AI出口"></label>
        <button id="saveSettings">保存设置并重新检测</button>
      </div>
    </details>

    <section id="empty" class="empty">
      <div class="shield">✓</div>
      <h2>先读取当前运行环境</h2>
      <p>检测本机时区、语言、DNS、IPv6、代理出口和专用浏览器设置，不会修改任何内容。</p>
    </section>

    <section id="results" class="results hidden"></section>

    <section class="log-panel">
      <div class="log-heading"><h2>执行记录</h2><button id="clear" class="link">清空</button></div>
      <pre id="log">等待操作…</pre>
    </section>
  </main>
  <script src="renderer.js"></script>
</body>
</html>
